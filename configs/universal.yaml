# scDFM 全局配置（2026-09-28 用户定案：config/config.py → configs/universal.yaml）
# 读取方式：from src.utils.config_utils import ConfigUtils, FlowConfig
#    cfg = ConfigUtils.load(FlowConfig)   # CLI 显式参数 > YAML（YAML 缺 key 直接报错）
# 2026-10-06 用户定案重组：common 节删除，配置按阶段拆分——
#   network（网络结构）/ train（训练启动）/ inference（推理）/ benchmark（提交）
#   / build_cache（缓存构建）/ build_tensors（张量构建）；跨入口共享字段经
#   network+train 自动合并，各阶段段同名字段覆盖。
# 换数据集 = 改 train 节（训练语料）+ inference 节（测试语料/panel/细胞数口径）。

# ================= 网络结构（2026-10-06 拆段：模型结构/词表/AE 编解码器） =================
network:
  model_type: origin
  ntoken: 19661             # 19,657 全轴基因（mrnh19657 语料轴）+ 4 specials
  n_top_genes: 19657        # 2026-10-07：19,657 轴（mrnh19657 语料轴，VCC 对齐）
  infer_top_gene: 19657
  d_model: 512
  perturbation_function: crisper
  fusion_method: differential_transformer  # differential_transformer | differential_perceiver（perceiver_latent 已删 2026-10-06）
  use_perturbation_interaction: true   # false=放弃共表达 mask（AE 模式自动关）
  use_negative_edge: true   # 论文 kNN k=30 带符号相关（signed mask）
  topk: 30
  mask_subsample: 50000     # 共表达图采样细胞数（0=全部）
  # 前向机制（2026-10-06 拆段：训练/推理共用同一前向，噪声与模式属模型定义）
  noise_type: Gaussian      # ODE 初始噪声分布（Gaussian | Poisson）
  poisson_alpha: 0.8        # Poisson 噪声形状（log-normal alpha）
  poisson_target_sum: -1    # Poisson 噪声每细胞 L1 目标（-1=不约束）
  mode: predict_y           # 前向模式（predict_y=扰动预测）
  # AE 潜空间维数（网络结构参数；编解码器 ckpt 路径在 train/inference 节，
  # 与 checkpoint_path 同类——2026-10-06 用户定案）
  ae_latent_dim: 2048        # 2026-10-07 加深版定案：4096→2048，主模型潜序列 L=2048

# ================= 训练启动（2026-10-06 拆段：训练超参/语料/数据口径/路径） =================
train:
  # 训练语料文件列表（2026-10-07 起 mrnh19657：17 原始数据集 ∪ 官方 18533 ∪ H1 的 19,657 基因轴并集，
  # target_gene/context 已派生；扰动方向筛选由下方 perturb_direction 在代码中执行）
  train_set_paths:
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/marson_d1_rest.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/marson_d1_stim8hr.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/marson_d1_stim48hr.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/marson_d2_rest.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/marson_d2_stim8hr.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/marson_d2_stim48hr.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/marson_d3_rest.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/marson_d3_stim8hr.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/marson_d3_stim48hr.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/marson_d4_rest.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/marson_d4_stim8hr.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/marson_d4_stim48hr.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/nadig_hepg2.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/nadig_jurkat.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/replogle_k562_essential.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/replogle_k562_gwps.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/replogle_rpe1.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/h1.h5ad
  # 扰动方向白名单（2026-09-28 用户定案）：训练侧只保留 exo_perturb_subtype 值
  # 在此列表内的细胞。当前 [CRISPRi]=只留敲低（K562 CRISPRa 细胞全部剔除）；空列表=不过滤。
  perturb_direction: [CRISPRi]
  # 输出/日志基目录（2026-10-06 拆段：训练入口专属；拼 <基>/train_<ts>）
  output_base_dir: output
  log_base_dir: logs
  # 训练缓存目录（processed_*.h5ad/.meta 与派生文件；cache 软链 → /ssd4 实盘）
  train_cache_dir: /home/ict2/Projects/scDFM/cache/cache_mrnh19657
  # 残差目标冻结张量目录（rbar_c/rbar_p/gbar/res_<line>.npy/combos.csv，19,657 轴）
  frozen_tensors_dir: /home/ict2/Projects/scDFM/output/tensors_mrnh19657
  cache_workers: 18        # 缓存流式构建并行 worker 数（文件级并行，≤入训文件数=18）
  # VCC-2026 panel 清单 CSV（300 基因，训练启动校验用；与推理节同源）
  panel_csv_path: /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/pert_counts.csv
  batch_size_per_gpu: 32      # 每卡 batch size（2026-10-07 重命名定案：全局 batch = 此值 × gpus）
  lr: 5.0e-5
  steps: 300000             # 2026-10-07 用户定案：100k→300k（潜空间 2048 步时减半后总步数上调）
  early_stop_patience: 10   # 早停：print_every 窗口数（10×1000=10k 步无改善即停；0=禁用；2026-10-07 5→10）
  eta_min: 1.0e-6
  devices: "1"
  data_name: vcc
  print_every: 1000
  resume: ''                # 续训入口（CLI --resume <ckpt>；2026-10-05；checkpoint_path 已移除 2026-10-06）
  # AE 编解码器 ckpt（2026-10-06 用户定案：ckpt 路径与 checkpoint_path 同类，
  # 训练加载用 train 节、推理用 inference 节各配一份；两路径非空=AE 模式）
  ae_encoder_ckpt: /share/ict2/Projects/scDFM/output/autoencoder_mrnh19657/encoder_2026-10-07_16-04.pt
  ae_decoder_ckpt: /share/ict2/Projects/scDFM/output/autoencoder_mrnh19657/decoder_2026-10-07_16-04.pt
  gamma: 0.5                # 论文 MMD λ=0.5（残差范式 use_mmd_loss=false 未启用）
  split_method: whole       # replogle 留系：train 全量训练，测试语料=独立 RPE1 文件
  use_mmd_loss: false       # 残差目标范式去 MMD（2026-09-26 用户定案）
  fold: 0
  data_path: /home/ict2/Projects/scDFM/tmp
  gpus: 8                     # torchrun --nproc_per_node 须与此一致（2026-10-07：batch 口径 = batch_size_per_gpu，不再有 batch_total）
  train_pool_path: ''
  line_col: context         # replogle train 文件 context=K562/Jurkat/HepG2
  heldout_line: RPE1
  max_test_perts: 20
  num_workers: 4
  use_bf16: true
  do_eval: false            # 多卡 DDP 下必须 false（NCCL 死锁）
  min_tgt_cells: 20

# ================= 推理（2026-09-28 用户定案：dispatch 分发，单基因 part 落 .partial，
# 全部完成后合并 predictions.h5ad 并清空 .partial；CLI flag 仍可覆盖） =================
inference:
  # 输出/日志基目录（2026-10-06 拆段：推理入口专属；拼 <基>/inference_<ts>。
  # 2026-10-06 晚 worker03 正式推理：项目根 output/logs）
  output_base_dir: output
  log_base_dir: logs
  # main 模型 ckpt（2026-10-06 用户定案：推理三模型分别 yaml 指定——
  # 训练目录自动取 main_best.pt，或直接填 main_*.pt 文件路径；AE 两路径同节）
  # 2026-10-06 晚：worker03 正式推理——三权重全用 15000 轮（best）
  checkpoint_path: /home/ict2/Projects/scDFM/output/train_2026-10-07_17-26/best
  # AE 编解码器 ckpt（与 checkpoint_path 同类放 inference；两路径非空=AE 模式）
  ae_encoder_ckpt: /home/ict2/Projects/scDFM/output/autoencoder_mrnh19657/encoder_2026-10-07_16-04.pt
  ae_decoder_ckpt: /home/ict2/Projects/scDFM/output/autoencoder_mrnh19657/decoder_2026-10-07_16-04.pt
  # 测试集（留系真实侧，独立文件；whole 口径专用）
  test_set_paths: /ssd3/PubData/gene_alignment/Replogle_RPE1/Replogle_RPE1.h5ad
  # 推理 control 来源（2026-09-30 用户定案）：多个数据集，各取 target_gene ==
  # 'non-targeting' 的细胞作推理 control（ODE 源），保留各文件原生 context 标签
  # （官方 A/B/C 语义）；空列表=退回 test_set_paths 单文件口径。
  inference_control_paths:
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/context_A_n19657.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/context_B_n19657.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/context_C_n19657.h5ad
  # 提交轴 18533 基因清单（2026-10-06 用户定案：pred 整合时 训练轴→18533 轴还原依据）
  output_genes_csv: /home/ict2/Projects/vcc-2026/resources/datasets/controls/gene_names.csv
  # 训练缓存/冻结张量目录（推理链派生缓存/mask/vocab 键与残差常量用；与 train 节同源）
  train_cache_dir: /home/ict2/Projects/scDFM/cache/cache_mrnh19657
  frozen_tensors_dir: /home/ict2/Projects/scDFM/output/tensors_mrnh19657
  # VCC-2026 panel 清单 CSV（推理范围：300 基因 × context 任务）
  panel_csv_path: /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19657/pert_counts.csv
  # real/pred 细胞数口径（2026-09-30 按 VCC 官方规格修正）：
  n_ctrl_cells: 18400       # real 侧对照细胞数=官方每 context 对照全量（val manifest control_cells=18400）
  n_pred_cells: 400         # 每扰动预测细胞数=官方提交强制（vcc prep EXPECTED_CELLS_PER_PERT=400）
  n_real_cells: 2000        # real 侧每扰动参考细胞数上限；官方评分不截断真实参考（官方 replogle 每基因 ≤1924，2000 等效全量）
  min_real_cells: 100       # real 侧每扰动最少细胞数；官方真实数据每基因 ≥101（实测 min），100 保留全 300 基因
  heldout_line: RPE1        # 留出系（测试集独立文件时仅作标签名）
  ode_steps: 100            # ODE 积分步数（2026-09-26 新残差范式定案 100 步）
  batch_size_per_gpu: 400   # worker 每基因推理 batch（2026-10-06 用户定案：单批整个基因；
                            # 2026-10-07 重命名 batch_size → batch_size_per_gpu，每卡口径统一）
                            # 实测 400 与 100 耗时相同，400 省批开销；潜空间 4096 显存富余）
  gpus: 8                   # dispatch 并行卡数上限（2026-10-06 晚 worker03 正式推理：8 卡全用）
  cuda_devices: ''          # dispatcher 可见卡（空=全部可见；worker01 的 0-3 被 slchang
                            # 独占时才需要过滤，worker03 全卡可用）
  free_mb: 51200            # 空闲显存门控（MiB）
  poll_s: 10.0              # 轮询周期（秒）
  max_retry: 3              # 单基因进程级失败重试上限
  settle_s: 0.0             # 启动后先等待 N 秒再扫描 done/下发（重启时等在飞旧 worker 跑完）
  seed: 42

# ================= benchmark 阶段（2026-10-06 用户定案：submit.py 全部配置经此节
# yaml 读入，不再接受 CLI flag） =================
benchmark:
  output_base_dir: output # 输出基地址；实际目录 = <基地址>/benchmark_<YYYY-MM-DD_HH-MM>
  log_base_dir: logs      # 日志基地址；拼 <基>/benchmark_<ts>/prep_<stem>.log
  pred_h5ad: output/inference_2026-10-07_23-35/predictions.h5ad  # 提交前填：推理产物（如 output/inference_<ts>/pred.h5ad）
  out_vcc: ''             # .vcc 输出路径（空=默认 <实际目录>/<pred stem>.vcc）
  controls_dir: /home/ict2/Projects/vcc-2026/resources/datasets/controls
  genes_vcc: /home/ict2/Projects/vcc-2026/resources/datasets/controls/gene_names.csv  # 提交轴基因清单（18533）
  model_name: scDFM
  resume_upload: false    # 上传中断续传（aborted upload 锁团队槽位时必须 true）
  no_wait: false          # true=提交后不阻塞等评分
  dry_run: false          # true=prep 只校验不产出、不提交

# ================= build_cache 阶段（2026-10-06 拆段：缓存构建入口专属） =================
build_cache:
  output_base_dir: output
  log_base_dir: logs
  # 缓存产物目录（与 train 节同源；缓存软链 → /ssd4 实盘）
  train_cache_dir: /home/ict2/Projects/scDFM/cache/cache_mrnh19657
  cache_workers: 18        # 缓存流式构建并行 worker 数

# ================= build_tensors 阶段（2026-10-06 拆段：冻结张量构建入口专属） =================
build_tensors:
  output_base_dir: output
  log_base_dir: logs
  # 冻结张量产物目录（与 train 节同源）
  frozen_tensors_dir: /home/ict2/Projects/scDFM/output/tensors_mrnh19657
  # real 侧三件套细胞数口径（与 inference 节同源；官方 context=18400 取子集控时长）
  n_ctrl_cells: 18400
  n_pred_cells: 400
  n_real_cells: 2000
  min_real_cells: 100
