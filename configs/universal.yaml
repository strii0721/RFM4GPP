# scDFM 全局配置（2026-09-28 用户定案：config/config.py → configs/universal.yaml）
# 读取方式：from src.utils.ConfigUtils import ConfigUtils, FlowConfig, CommonConfig
#    cfg = ConfigUtils.load(FlowConfig)   # CLI 显式参数 > YAML（YAML 缺 key 直接报错）
# 换数据集 = 改本文件的 common 节（训练集 / 测试集 / panel CSV / 冻结张量目录）。

common:
  # 训练语料文件列表：分散在多个文件夹的多个文件，建缓存时按序读入并沿 obs 拼接
  # （var 轴须逐文件一致）。缓存/mask/vocab 派生键含各文件名。
  # 2026-09-30 起：mrn19843 构建产物（17 原始数据集的 19,843 基因轴并集，
  # target_gene/context 已由构建方派生好；轴=19,843 symbol）。
  # 17 文件全列出（2026-09-30 用户定案：replogle_rpe1 也作训练集）；
  # 扰动方向筛选由下方 common.perturb_direction 在代码中执行。
  train_set_paths:
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19547/marson_d1_rest.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19547/marson_d1_stim8hr.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19547/marson_d1_stim48hr.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19547/marson_d2_rest.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19547/marson_d2_stim8hr.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19547/marson_d2_stim48hr.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19547/marson_d3_rest.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19547/marson_d3_stim8hr.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19547/marson_d3_stim48hr.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19547/marson_d4_rest.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19547/marson_d4_stim8hr.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19547/marson_d4_stim48hr.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19547/nadig_hepg2.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19547/nadig_jurkat.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19547/replogle_k562_essential.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19547/replogle_k562_gwps.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19547/replogle_rpe1.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/mrnh19547/h1.h5ad
  # 扰动方向白名单（2026-09-28 用户定案）：训练侧只保留 exo_perturb_subtype 值
  # 在此列表内的细胞。当前 [CRISPRi]=只留敲低（K562 CRISPRa 细胞全部剔除）；
  # 空列表=不过滤。panel 覆盖实测：Nadig 两文件并集对 282 panel ≥20 细胞 282/282。
  perturb_direction: [CRISPRi]
  # obs 语义列匹配表（2026-09-28 用户定案）：不同数据集构建方表头命名相互独立，
  # 每个语义字段按候选列表顺序取第一个匹配上的列（derive_pert_columns），
  # 全部未命中直接报错。换新命名数据集只改这里。
  obs_col_candidates:
    pert_gene: [target_gene, perturbation]     # 扰动基因列
    ctrl_flag: [is_control]                    # 对照组标记列（bool；可选，无则用哨兵值）
    cell_line: [context, cell_line_name]       # 细胞系列
  # 扰动基因列中的对照哨兵值（无 ctrl_flag 候选列时用于判定对照；大小写/空白不敏感）
  ctrl_sentinels: [non-targeting, non_targeting, ctrl, control, ntc, negative_control]
  # checkpoint 基路径（2026-09-28 定案：train.py 在此基名下拼 _<ts>/iteration_N 存 checkpoint）
  # 输出基目录（train checkpoint 与 inference 产物共用；代码拼 <基目录>/<任务名>_<ts>）
  output_base_dir: output
  # 日志基目录（2026-09-29 定案：train/build_tensors/inference 三入口共用）
  log_base_dir: logs
  # real/pred 细胞数口径（2026-09-30 按 VCC 官方规格修正）：
  n_ctrl_cells: 18400       # real 侧对照细胞数=官方每 context 对照全量（val manifest control_cells=18400）
  n_pred_cells: 400         # 每扰动预测细胞数=官方提交强制（vcc prep EXPECTED_CELLS_PER_PERT=400）
  n_real_cells: 2000        # real 侧每扰动参考细胞数上限；官方评分不截断真实参考（官方 replogle 每基因 ≤1924，2000 等效全量）
  min_real_cells: 100       # real 侧每扰动最少细胞数；官方真实数据每基因 ≥101（实测 min），100 保留全 300 基因
  # 测试集（留系真实侧，独立文件；whole 口径专用）
  test_set_paths: /ssd3/PubData/gene_alignment/Replogle_RPE1/Replogle_RPE1.h5ad
  # 推理 control 来源（2026-09-30 用户定案）：多个数据集，各取 target_gene ==
  # 'non-targeting' 的细胞作推理 control（ODE 源），保留各文件原生 context 标签
  # （官方 A/B/C 语义）；空列表=退回 test_set_paths 单文件口径。
  inference_control_paths:
    - /home/ict2/Projects/vcc-2026/resources/datasets/controls/context_A.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/controls/context_B.h5ad
    - /home/ict2/Projects/vcc-2026/resources/datasets/controls/context_C.h5ad
  cache_workers: 18        # 缓存流式构建并行 worker 数（文件级并行，≤入训文件数=18）
  # VCC-2026 panel 清单 CSV（2026-09-30 用户定案：mrn19843/pert_counts.csv，300 基因，
  # 全部在 19,843 轴内；与训练语料无关）
  panel_csv_path: /home/ict2/Projects/vcc-2026/resources/datasets/controls/pert_counts.csv
  # 残差目标冻结张量目录（rbar_c/rbar_p/gbar/res_<line>.npy/combos.csv）
  # 2026-09-30 起：19,843 轴（mrn19843 语料）专用目录
  frozen_tensors_dir: /home/ict2/Projects/scDFM/output/frozen_tensors_mrnh19547
  # 训练缓存目录（processed_*.h5ad/.meta 与派生文件；2026-09-28 定案）
  # 2026-09-30：cache 软链 → /ssd4/PubData/ict2/cache（实盘迁移，逻辑路径不变）
  train_cache_dir: /home/ict2/Projects/scDFM/cache/train_cache_mrnh19547
  # AE 可学习编解码器接入（2026-10-06 用户定案：warm-start + 联合微调）
  ae_encoder_ckpt: /home/ict2/Projects/scDFM/output/autoencoder_ckpts/encoder_2026-10-06_12-34.pt
  ae_decoder_ckpt: /home/ict2/Projects/scDFM/output/autoencoder_ckpts/decoder_2026-10-06_12-34.pt
  ae_latent_dim: 4096

# 训练参数（仅 FlowConfig 本身套用；GenConfig/BenchConfig/ScanConfig 子类不套用，
# 它们的运行态字段走各自 schema 默认 + CLI）
flow:
  model_type: origin
  batch_size: 96            # 论文全局 batch=96；8 卡 DDP 时 train.py 按 batch_total/gpus 分摊每 rank
  ntoken: 19551             # 19,547 全轴基因（mrnh19547 语料轴）+ 4 specials
  d_model: 512
  lr: 5.0e-5
  steps: 100000             # 2026-10-05 用户定案：10k→100k + 早停（见 early_stop_patience）
  early_stop_patience: 5    # 早停：print_every 窗口数（5×1000=5k 步无改善即停；0=禁用；2026-10-06 10→5）
  eta_min: 1.0e-6
  devices: "1"
  test_only: false
  data_name: vcc
  perturbation_function: crisper
  noise_type: Gaussian
  poisson_alpha: 0.8
  poisson_target_sum: -1
  print_every: 1000
  mode: predict_y
  perturbation_fusion_method: sum
  fusion_method: differential_transformer  # differential_transformer | differential_perceiver（perceiver_latent 已删 2026-10-06）
  use_perturbation_interaction: true   # false=放弃共表达 mask
  infer_top_gene: 19547
  n_top_genes: 19547        # 2026-10-05：19,547 轴（mrnh19547 语料轴，VCC 对齐）
  resume: ''                # 续训入口（CLI --resume <ckpt>；2026-10-05；checkpoint_path 已移除 2026-10-06）
  gamma: 0.5                # 论文 MMD λ=0.5（残差范式 use_mmd_loss=false 未启用）
  split_method: whole       # replogle 留系：train 全量训练，测试语料=独立 RPE1 文件
  use_mmd_loss: false       # 残差目标范式去 MMD（2026-09-26 用户定案）
  fold: 0
  use_negative_edge: true   # 论文 kNN k=30 带符号相关（signed mask）
  topk: 30
  data_path: /home/ict2/Projects/scDFM/tmp
  batch_total: 256            # 2026-10-06：AE 潜空间 4096 → B=32/卡 冒烟口径（8 卡并行验证中）
  gpus: 8                     # torchrun --nproc_per_node 须与此一致；train.py 据此算每 rank batch
  train_pool_path: ''
  line_col: context         # replogle train 文件 context=K562/Jurkat/HepG2
  max_len: 500
  max_len_batch: 1000
  heldout_line: RPE1
  condition_token_ratio: 0.25
  condition_max_tokens: 400
  mask_subsample: 50000     # 共表达图采样细胞数（0=全部）
  max_test_perts: 20
  num_workers: 4
  use_bf16: true
  do_eval: false            # 多卡 DDP 下必须 false（NCCL 死锁）
  min_tgt_cells: 20
  # CRISPR 过滤开关（2026-09-28 补回）：机制=列存在性门控（列不在 obs 则静默跳过）。
  # 已被 common.perturb_direction 取代，保持空串禁用。
  crispr_type_col: ''
  crispr_type_value: ''

# 推理运行态参数（2026-09-28 用户定案：inference.py 启动即 dispatch 分发，
# 单基因推理 part 先落 .partial，全部完成后合并 predictions.h5ad 并清空 .partial；
# 积分步数等由此节配置，CLI flag 仍可覆盖）
inference:
  # main 模型 ckpt（2026-10-06 用户定案：推理三模型分别 yaml 指定——
  # 训练目录自动取 main_best.pt，或直接填 main_*.pt 文件路径；AE 两路径在 common 节）
  checkpoint_path: ''
  heldout_line: RPE1        # 留出系（测试集独立文件时仅作标签名）
  ode_steps: 100            # ODE 积分步数（2026-09-26 新残差范式定案 100 步）
  batch_size: 100           # worker 每基因推理 batch（2026-10-06 AE 潜空间：400÷100=4 批整；
                            # 全轴 19547 时代 128 曾贴 77GB，潜空间 4096 下显存零头）
  gpus: 8                   # dispatch 轮询的卡数（可用 < free_mb 的卡自动跳过）
  free_mb: 51200            # 空闲显存门控（MiB）
  poll_s: 10.0              # 轮询周期（秒）
  max_retry: 3              # 单基因进程级失败重试上限
  seed: 42
